<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réalisations — Variante A (référence design)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #fff; color: #111; }

  /* ── Nav ── */
  .ym-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2rem; height: 56px; background: #fff; border-bottom: 1px solid #e5e2dc;
    position: sticky; top: 0; z-index: 10;
  }
  .ym-logo { font-weight: 700; font-size: 1rem; color: #111; text-decoration: none; letter-spacing: .04em; }
  .ym-nav-links { display: flex; gap: 1.75rem; list-style: none; }
  .ym-nav-links a { font-size: .85rem; color: #444; text-decoration: none; letter-spacing: .02em; }
  .ym-nav-links a.active { color: #111; font-weight: 600; border-bottom: 1.5px solid #111; padding-bottom: 2px; }

  /* ── Hero ── */
  .hero {
    padding: 3.5rem 2.5rem 2.5rem; border-bottom: 1px solid #ece9e3;
  }
  .hero-eyebrow {
    font-size: .72rem; letter-spacing: .12em; text-transform: uppercase;
    color: #888; margin-bottom: .6rem;
  }
  .hero-title {
    font-size: 2.4rem; font-weight: 700; color: #111;
    line-height: 1.1; margin-bottom: .7rem; letter-spacing: -.02em;
  }
  .hero-sub {
    font-size: .95rem; color: #666; max-width: 520px; line-height: 1.65;
  }

  /* ── Filter bar ── */
  .filter-section { padding: 1.5rem 2.5rem; border-bottom: 1px solid #f0ede8; }
  .filter-row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .filter-count { margin-left: auto; font-size: .78rem; color: #999; }

  .pill {
    padding: .38rem .9rem; border-radius: 99px; font-size: .78rem;
    letter-spacing: .02em; cursor: pointer; border: 1.5px solid #e5e2dc;
    background: #f4f2ee; color: #555; font-weight: 500;
    transition: background .18s ease, border-color .18s ease, color .18s ease;
    font-family: inherit;
  }
  .pill:hover { background: #e8f4f0; border-color: #6abfaa; color: #2a7a65; }
  .pill.active { background: #2a7a65; border-color: #2a7a65; color: #fff; }

  /* ── Grid ── */
  .grid-section { padding: 2rem 2.5rem 4rem; }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.25rem;
  }
  @media (max-width: 900px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 580px) { .card-grid { grid-template-columns: 1fr; } }

  /* ── Card ── */
  .card {
    border: 1.5px solid #ece9e3; border-radius: 10px; overflow: hidden;
    background: #fff; cursor: pointer;
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    display: flex; flex-direction: column;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 14px 36px rgba(0,0,0,.09);
    border-color: #6abfaa;
  }

  .card-thumb {
    height: 148px; background: #f7f5f1;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.4rem; border-bottom: 1.5px solid #ece9e3;
    position: relative; overflow: hidden;
  }
  /* Overlay teinté vert sauge très léger */
  .card-thumb::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg,
      oklch(55% .12 182 / .06) 0%,
      oklch(55% .12 182 / .14) 100%);
    pointer-events: none;
  }
  .card-thumb-emoji { position: relative; z-index: 1; }

  .card-body { padding: 1.1rem 1.2rem 1.3rem; display: flex; flex-direction: column; flex: 1; }
  .card-tags { display: flex; gap: .4rem; margin-bottom: .6rem; flex-wrap: wrap; }

  /* Badge type */
  .badge {
    font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 700; padding: .22rem .6rem; border-radius: 4px;
  }
  .badge-etude  { background: #f0faf6; color: #2a7a65; }
  .badge-astuce { background: #fff8ed; color: #b87a00; }
  .badge-outil  { background: #f0f4ff; color: #4060c0; }
  .badge-site   { background: #fdf0f8; color: #9040a0; }

  .card-title { font-size: .95rem; font-weight: 700; color: #111; margin-bottom: .38rem; line-height: 1.35; }
  .card-desc  { font-size: .8rem; color: #666; line-height: 1.58; flex: 1; }

  .card-footer { margin-top: .85rem; padding-top: .75rem; border-top: 1px solid #f0ede8; display: flex; align-items: center; justify-content: space-between; }
  .card-meta-tags { display: flex; gap: .35rem; flex-wrap: wrap; }
  .card-meta-tag { font-size: .65rem; color: #aaa; font-weight: 500; }
  .card-meta-tag::before { content: '#'; }
  .card-link {
    font-size: .78rem; font-weight: 700; color: #2a7a65; text-decoration: none;
    display: inline-flex; align-items: center; gap: .25rem; white-space: nowrap;
  }
  .card-link .arrow { display: inline-block; transition: transform .18s ease; }
  .card:hover .card-link .arrow { transform: translateX(3px); }

  /* ── Footer ── */
  .site-footer {
    padding: 1.5rem 2.5rem; border-top: 1px solid #ece9e3;
    font-size: .78rem; color: #aaa; text-align: center;
  }

  /* ── Empty state ── */
  .empty {
    grid-column: 1 / -1; padding: 3rem; text-align: center;
    color: #999; font-size: .9rem;
  }
</style>
</head>
<body>

<nav class="ym-nav">
  <a class="ym-logo" href="https://yvesmarti.github.io/">YM</a>
  <ul class="ym-nav-links">
    <li><a href="https://yvesmarti.github.io/#parcours">Parcours</a></li>
    <li><a href="https://yvesmarti.github.io/outils">Outils</a></li>
    <li><a href="#" class="active">Réalisations</a></li>
    <li><a href="https://yvesmarti.github.io/#contact">Contact</a></li>
  </ul>
</nav>

<header class="hero">
  <div class="hero-eyebrow">Portfolio</div>
  <h1 class="hero-title">Réalisations</h1>
  <p class="hero-sub">Projets web, études de cas, astuces et outils pratiques autour de la donnée territoriale.</p>
</header>

<div class="filter-section">
  <div class="filter-row" id="filter-row">
    <button class="pill active" data-filter="all">Tout</button>
    <button class="pill" data-filter="etude">Étude de cas</button>
    <button class="pill" data-filter="astuce">Astuce</button>
    <button class="pill" data-filter="outil">Outil</button>
    <button class="pill" data-filter="site">Site web</button>
    <span class="filter-count" id="count"></span>
  </div>
</div>

<main class="grid-section">
  <div class="card-grid" id="grid"></div>
</main>

<footer class="site-footer">© 2026 Yves Marti</footer>

<script>
const items = [
  {
    id: 1,
    title: "Auto-École Marti",
    desc: "Site vitrine pour l'auto-école familiale. Présentation des formations, tarifs et contacts, adapté aux mobiles.",
    type: "site",
    tags: ["HTML", "CSS", "Jekyll"],
    emoji: "🚗",
    url: "https://autoecolemarti.fr"
  },
  {
    id: 2,
    title: "Automatiser la prospection Redevance Spéciale avec Power Query",
    desc: "Interroger les APIs publiques françaises depuis Excel pour constituer automatiquement la liste des entreprises assujetties sur un territoire intercommunal.",
    type: "etude",
    tags: ["Power Query", "Excel", "APIs"],
    emoji: "📊",
    url: "/realisations/etude-de-cas-redevance-speciale.html"
  },
  {
    id: 3,
    title: "APIs open data utiles pour les données territoriales",
    desc: "Sélection d'APIs publiques pour automatiser la collecte, structurer les référentiels géographiques et enrichir les analyses locales.",
    type: "astuce",
    tags: ["Open Data", "APIs", "GIS"],
    emoji: "🔗",
    url: "/realisations/api-utiles.html"
  },
  {
    id: 4,
    title: "Carte isochrone interactive",
    desc: "Outil HTML/JS autonome pour calculer et visualiser des zones d'accessibilité temporelle à partir d'un point sur la carte.",
    type: "outil",
    tags: ["Leaflet", "JS", "OSRM"],
    emoji: "🗺️",
    url: "/outils"
  },
  {
    id: 5,
    title: "Géocoder des adresses en masse",
    desc: "Un outil simple pour envoyer un fichier CSV d'adresses à la BAN et récupérer les coordonnées géographiques, sans installation.",
    type: "outil",
    tags: ["BAN", "CSV", "JS"],
    emoji: "📍",
    url: "/outils"
  },
  {
    id: 6,
    title: "Visualiser des photos géolocalisées sur une carte",
    desc: "Déposer un dossier de photos EXIF et les voir apparaître sur une carte Leaflet — utile pour les relevés terrain.",
    type: "astuce",
    tags: ["EXIF", "Leaflet", "JS"],
    emoji: "📸",
    url: "/outils"
  }
];

const typeLabels = { site:"Site web", etude:"Étude de cas", astuce:"Astuce", outil:"Outil" };
let activeFilter = "all";

function renderGrid() {
  const grid = document.getElementById("grid");
  const count = document.getElementById("count");
  const visible = activeFilter === "all" ? items : items.filter(i => i.type === activeFilter);

  count.textContent = visible.length + " résultat" + (visible.length > 1 ? "s" : "");

  if (visible.length === 0) {
    grid.innerHTML = '<div class="empty">Aucun résultat pour ce filtre.</div>';
    return;
  }

  grid.innerHTML = visible.map(item => `
    <article class="card" onclick="window.location.href='${item.url || '#'}'">
      <div class="card-thumb">
        <span class="card-thumb-emoji">${item.emoji}</span>
      </div>
      <div class="card-body">
        <div class="card-tags">
          <span class="badge badge-${item.type}">${typeLabels[item.type]}</span>
        </div>
        <h2 class="card-title">${item.title}</h2>
        <p class="card-desc">${item.desc}</p>
        <div class="card-footer">
          <div class="card-meta-tags">
            ${item.tags.map(t => `<span class="card-meta-tag">${t}</span>`).join("")}
          </div>
          <a class="card-link" href="${item.url || '#'}">Lire <span class="arrow">→</span></a>
        </div>
      </div>
    </article>
  `).join("");
}

document.getElementById("filter-row").addEventListener("click", e => {
  const btn = e.target.closest(".pill");
  if (!btn) return;
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  activeFilter = btn.dataset.filter;
  renderGrid();
});

renderGrid();
</script>
</body>
</html>
