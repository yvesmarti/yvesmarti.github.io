<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Titre & description -->
    {% assign page_title = page.title | default: site.title %}
    {% assign page_description = page.description | default: site.description %}
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ page_description }}">
    <meta name="keywords" content="{{ site.keywords }}">
    <meta name="author" content="{{ site.author }}">
    <meta name="robots" content="index, follow">
    <meta name="msvalidate.01" content="3144B81AE42A4C5BF0823F793B3392FB" />

    <!-- Canonical -->
    <link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}">

    <!-- Open Graph -->
    <meta property="og:type" content="{% if page.url == '/' %}profile{% else %}website{% endif %}">
    <meta property="og:title" content="{{ page_title }}">
    <meta property="og:description" content="{{ page_description }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url | replace:'index.html','' }}">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:site_name" content="{{ site.title }}">
    {% if page.url == "/" %}<meta property="profile:first_name" content="Yves">
    <meta property="profile:last_name" content="Marti">{% endif %}

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ page_title }}">
    <meta name="twitter:description" content="{{ page_description }}">

    <!-- JSON-LD Person schema (home uniquement) -->
    {% if page.url == "/" %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Yves Marti",
      "jobTitle": "{{ site.profession }}",
      "url": "{{ site.url }}",
      "sameAs": ["https://www.linkedin.com/in/{{ site.linkedin }}/"],
      "knowsAbout": ["QGIS", "SIG", "gestion des déchets", "cartographie", "analyse de données territoriales", "Normandie"],
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "Normandie",
        "addressCountry": "FR"
      }
    }
    </script>
    {% endif %}

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:wght@300;400;600&display=swap">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Outfit:wght@700&family=Space+Grotesk:wght@700&family=Space+Mono:wght@400;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Outfit:wght@700&family=Source+Sans+3:wght@300;400;600&family=Space+Grotesk:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS du site -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

    <div id="reading-progress" aria-hidden="true"></div>

    {% include header.html %}

    <main>
        {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
