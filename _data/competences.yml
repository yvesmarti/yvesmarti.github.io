  resume: "Rédiger des pièces assez précises pour que les offres reçues soient réellement comparables."
  details:
    - "Rédaction du CCTP : spécifications techniques lot par lot"
    - "Préparation du BPU et du DQE : quantités estimées et chiffrage prévisionnel"
    - "Cadres de réponse technique permettant une comparaison structurée"
    - "Analyse des offres et préparation des autres pièces du DCE"

- nom: Coordination multi-acteurs
  icone: "🤝"
  categorie: "Gestion de projet"
  couleur: "#E8943A"
  description: Pilotage de projets intercommunaux, dialogue avec élus, communes et prestataires
  resume: "Un projet de collecte n'avance que si les élus, les services techniques et les prestataires disent la même chose."
  details:
    - "Concertation avec les élus et les services techniques de 38 communes"
    - "Animation de groupes de travail réunissant les techniciens du territoire"
    - "Présentation des coûts et des scénarios en réunion d'élus"
    - "Coordination des prestataires et suivi de l'avancement des chantiers"

- nom: IA appliquée
  icone: "🤖"
  categorie: "IA comme outil de travail"
  couleur: "#E85A7E"
  description: "Claude, LM Studio, prompting appliqué au développement et à l'analyse"
  resume: "Utilisée comme un outil de travail parmi d'autres : du temps gagné sur le développement, la rédaction et l'analyse."
  details:
