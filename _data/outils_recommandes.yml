# Outils et sites recommandés par Yves Marti
# tags possibles : Logiciel, Site internet, Gratuit, SIG & Géo, Productivité

- nom: Recordly
  description: Enregistrez votre écran simplement et rapidement, sans configuration lourde — idéal pour créer des tutoriels ou documenter une démarche.
  url: https://recordly.dev
  tags:
    - Logiciel

- nom: Caesium
  description: Compressez vos photos en lot sans perte de qualité visible. Open source, disponible sur Windows, macOS et Linux.
  url: https://caesium.app/fr-FR
  tags:
    - Logiciel
    - Gratuit

- nom: WinDirStat
  description: Visualisez l'espace disque de votre PC sous forme de treemap colorée pour identifier rapidement les dossiers et fichiers volumineux. Outil indispensable avant de faire du tri.
  url: https://windirstat.net/download.html
  tags:
    - Logiciel
    - Gratuit

- nom: PowerToys
  description: "Suite d'utilitaires Microsoft pour power users Windows : renommage de fichiers en lot, sélecteur de couleurs, gestionnaire de fenêtres, aperçu avancé et bien plus."
  url: https://learn.microsoft.com/fr-fr/windows/powertoys/
  tags:
    - Logiciel
    - Gratuit
