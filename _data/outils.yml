# Liste des outils par catégorie
# actif: true = outil fonctionnel | false = "à venir" (grisé)

- categorie: Géomatique & Cartographie
  cat_id: geo
  outils:
    - nom: Création d'Isochrones via ORS
      emoji: "🎯"
      description: Générez des zones d'accessibilité temporelle autour d'un point pour analyser la couverture territoriale.
      lien: outils/isochrones_ORS.html
      actif: true

    - nom: Géocodage Inverse
      emoji: "📍"
      description: Obtenez une adresse à partir de coordonnées GPS pour identifier rapidement un lieu.
      lien: outils/geocodage_inverse_ban.html
      actif: true

    - nom: Géocodage adresses
      emoji: "🏠"
      description: Transformez une adresse en coordonnées GPS exploitables.
      lien: outils/geocodage_adresse_ban.html
      actif: true

    - nom: Visualiseur de Photos
      emoji: "🖼️"
      description: Visualisez l'emplacement de vos photos sur une carte interactive.
      lien: outils/photomapviewer.html
      actif: true

    - nom: Photo Geo Manager
      emoji: "📸"
      description: Renommez vos photos automatiquement en fonction de leur géolocalisation GPS.
      lien: outils/photogeomanager.html
      actif: true

    - nom: Extraction de données OSM
      emoji: "🗺️"
      description: Récupérez des données OpenStreetMap pour une zone donnée.
      lien: outils/extracteurosm.html
      actif: true

    - nom: Suivi Collecte Déchets
      emoji: "♻️"
      description: Suivez et gérez vos collectes de déchets sur une carte interactive.
      lien: outils/suivi/index.html
      actif: true

- categorie: Analyse de Données
  cat_id: analyse
  outils:
    - nom: Générateur de diagrammes de Sankey
      emoji: "🔀"
      description: Créez des diagrammes de Sankey pour visualiser des flux (tonnages, budgets, matières) directement dans le navigateur.
      lien: outils/sankey-builder.html
      actif: true

    - nom: Outil d'analyse statistique
      emoji: "📊"
      description: Emplacement disponible pour un outil d'analyse statistique.
      lien: "#"
      actif: false

    - nom: Exploration de données
      emoji: "🔍"
      description: Emplacement disponible pour un outil d'exploration de données.
      lien: "#"
      actif: false

- categorie: Environnement & Déchets
  cat_id: env
  outils:
    - nom: Générateur de Calendrier de Collecte
      emoji: "📅"
      description: Créez un calendrier personnalisé pour vos collectes de déchets (ordures ménagères, recyclage, etc.).
      lien: outils/generateur_calendrier_collecte.html
      actif: true

    - nom: Dimensionnement de dalles
      emoji: "📐"
      description: Configurez et dimensionnez vos dalles pour points d'apport volontaire avec bacs et claustra.
      lien: outils/schemas_dalles.html
      actif: true

    - nom: Implantation de colonnes enterrées
      emoji: "🗑️"
      description: Planifiez et visualisez l'implantation de colonnes enterrées (PAV) sur une carte interactive avec gestion des contraintes terrain.
      lien: outils/implantation-pav.html
      actif: true

    - nom: Outil environnemental
      emoji: "🌿"
      description: Emplacement disponible pour un outil environnemental.
      lien: "#"
      actif: false

- categorie: Autres outils pratiques
  cat_id: autres
  outils:
    - nom: Générateur de QR codes
      emoji: "📱"
      description: Créez des QR codes (URL, contact vCard, WiFi) directement dans le navigateur, sans serveur ni transfert de données.
      lien: outils/qr-code.html
      actif: true

    - nom: Annotateur de carte
      emoji: "✏️"
      description: Annotez vos captures satellite pour délimiter les zones de présentation des bacs, puis exportez en PNG.
      lien: outils/annotateur-carte.html
      actif: true

    - nom: Encart GPS pour photos
      emoji: "📌"
      description: Générez un encart de localisation précis pour vos photos, à partir des données GPS EXIF du fichier ou de coordonnées saisies manuellement.
      lien: outils/encart-gps.html
      actif: true
