<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yves Marti — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --serif: "Playfair Display", "Cormorant Garamond", Georgia, serif;
    --sans: "Manrope", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  /* DARK theme (default) */
  html[data-theme="dark"] {
    --bg: #0a2418;
    --bg-2: #08200f;
    --fg: #f0efe6;
    --fg-dim: rgba(240, 239, 230, 0.72);
    --fg-faint: rgba(240, 239, 230, 0.38);
    --accent: #5fc6a8;
    --accent-soft: rgba(95, 198, 168, 0.18);
    --line: rgba(240, 239, 230, 0.14);
    --btn-border: rgba(240, 239, 230, 0.35);
    --btn-hover-bg: rgba(95, 198, 168, 0.08);
    --vignette-out: rgba(0, 0, 0, 0.55);
  }
  /* LIGHT theme */
  html[data-theme="light"] {
    --bg: #f3f7f3;
    --bg-2: #e9efe9;
    --fg: #0d2a20;
    --fg-dim: rgba(13, 42, 32, 0.78);
    --fg-faint: rgba(13, 42, 32, 0.45);
    --accent: #1f6b50;
    --accent-soft: rgba(31, 107, 80, 0.15);
    --line: rgba(13, 42, 32, 0.18);
    --btn-border: rgba(13, 42, 32, 0.4);
    --btn-hover-bg: rgba(31, 107, 80, 0.08);
    --vignette-out: rgba(13, 42, 32, 0.08);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    transition: background-color .5s ease, color .5s ease;
  }

  /* ====== HERO ====== */
  .hero {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    isolation: isolate;
  }
  .hero-parallax-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%, transparent 0%, var(--vignette-out) 100%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 60%, var(--bg) 100%);
    z-index: 0;
    transition: background .5s ease;
  }
  #isoline-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    transition: opacity .5s ease;
  }

  /* Nav */
  .nav {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 32px 56px;
    z-index: 3;
  }
  .nav-logo {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.04em;
    color: var(--fg);
    justify-self: start;
  }
  .nav-links {
    display: flex;
    gap: 44px;
    justify-self: center;
    list-style: none;
    margin: 0; padding: 0;
  }
  .nav-links a {
    color: var(--fg);
    text-decoration: none;
    font-size: 11.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 500;
    opacity: 0.92;
    transition: color .2s, opacity .2s;
  }
  .nav-links a:hover { color: var(--accent); opacity: 1; }
  .nav-actions {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .theme-toggle {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--fg);
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border-radius: 50%;
    transition: background .2s, color .2s, transform .3s;
  }
  .theme-toggle:hover { background: var(--accent-soft); color: var(--accent); }
  .theme-toggle svg { width: 18px; height: 18px; }
  html[data-theme="dark"] .icon-moon { display: none; }
  html[data-theme="light"] .icon-sun { display: none; }

  /* Hero content */
  .hero-content {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px 24px 80px;
    max-width: 760px;
    margin: 0 auto;
  }
  .hero-name {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(48px, 7vw, 88px);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
    color: var(--fg);
    opacity: 0;
    animation: rise 1.1s cubic-bezier(.2,.7,.2,1) .15s forwards;
  }
  .hero-divider {
    width: 56px;
    height: 1px;
    border: none;
    background: var(--accent);
    margin: 0 0 24px;
    opacity: 0;
    transform: scaleX(0);
    transform-origin: center;
    animation: expand 0.9s cubic-bezier(.2,.7,.2,1) .55s forwards;
  }
  .hero-role {
    margin: 0 0 28px;
    color: var(--accent);
    font-size: 12.5px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    font-weight: 500;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(.2,.7,.2,1) .65s forwards;
  }
  .hero-intro {
    margin: 0 0 44px;
    color: var(--fg-dim);
    font-size: 17px;
    line-height: 1.65;
    font-weight: 300;
    max-width: 520px;
    text-wrap: pretty;
    opacity: 0;
    animation: rise 1s cubic-bezier(.2,.7,.2,1) .85s forwards;
  }
  .hero-cta {
    opacity: 0;
    animation: rise 1s cubic-bezier(.2,.7,.2,1) 1.05s forwards;
  }
  .hero-cv-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 14px 28px;
    border: 1px solid var(--btn-border);
    color: var(--fg);
    background: transparent;
    text-decoration: none;
    font-size: 11.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 500;
    transition: all .25s ease;
    position: relative;
    overflow: hidden;
  }
  .hero-cv-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--btn-hover-bg);
  }
  .hero-cv-btn svg {
    transition: transform .25s ease;
  }
  .hero-cv-btn:hover svg { transform: translateX(4px); }

  .scroll-indicator {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--fg-faint);
    font-size: 10.5px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    z-index: 2;
    opacity: 0;
    animation: pulse 2.4s ease-in-out 1.4s infinite;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes expand {
    from { opacity: 0; transform: scaleX(0); }
    to { opacity: 1; transform: scaleX(1); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.45; transform: translateX(-50%) translateY(0); }
    50% { opacity: 0.85; transform: translateX(-50%) translateY(4px); }
  }

  /* Mode-specific canvas tweaks */
  html[data-mode="voronoi"] #isoline-canvas { mix-blend-mode: normal; }
  html[data-mode="topographic"] #isoline-canvas { mix-blend-mode: normal; }
  html[data-mode="isolines"] #isoline-canvas { mix-blend-mode: normal; }

  /* Tweaks panel host */
  #tweaks-root { position: fixed; right: 0; bottom: 0; z-index: 100; }

  @media (max-width: 700px) {
    .nav { padding: 24px; }
    .nav-links { display: none; }
  }
</style>
</head>

<body>
<main>
  <!-- Hero -->
  <section class="hero" data-screen-label="01 Hero">
    <div class="hero-parallax-bg" aria-hidden="true"></div>
    <canvas id="isoline-canvas" aria-hidden="true"></canvas>

    <nav class="nav" aria-label="Navigation principale">
      <a href="#" class="nav-logo">YM</a>
      <ul class="nav-links">
        <li><a href="#parcours">Parcours</a></li>
        <li><a href="#outils">Outils</a></li>
        <li><a href="#realisations">Réalisations</a></li>
        <li><a href="#cv">CV</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Changer de thème">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </nav>

    <div class="hero-content">
      <h1 class="hero-name">Yves Marti</h1>
      <hr class="hero-divider" aria-hidden="true">
      <p class="hero-role">Chargé de mission déchets &amp; SIG · Normandie</p>
      <p class="hero-intro" id="hero-typewriter">
        Terrain, données, outils. Je transforme des besoins concrets en solutions qui fonctionnent.
      </p>
      <div class="hero-cta">
        <a href="/cv" class="hero-cv-btn">
          Consulter mon CV
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>
    </div>
    <span class="scroll-indicator">Défiler</span>
  </section>
</main>

<div id="tweaks-root"></div>

<!-- d3-delaunay for the Voronoi variant -->
<script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6"></script>

<!-- Background renderer -->
<script src="background.js"></script>

<script>
  // ----- Boot canvas -----
  const canvas = document.getElementById('isoline-canvas');
  HeroBg.init(canvas, {
    isDark: document.documentElement.dataset.theme === 'dark',
  });
  document.documentElement.dataset.mode = 'isolines';

  // ----- Mouse warp -----
  const hero = document.querySelector('.hero');
  hero.addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect();
    HeroBg.setMouse(e.clientX - r.left, e.clientY - r.top);
  });
  hero.addEventListener('pointerleave', () => HeroBg.leaveMouse());

  // ----- Theme toggle -----
  const themeBtn = document.getElementById('theme-toggle');
  themeBtn.addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    HeroBg.setTheme(next === 'dark');
    // Sync tweaks panel state if mounted
    window.dispatchEvent(new CustomEvent('__themeChange', { detail: next }));
  });
</script>

<!-- React + Babel for Tweaks panel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="tweaks-app.jsx"></script>

</body>
</html>
