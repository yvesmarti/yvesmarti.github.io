# Configuration du site
title: Yves MARTI
description: "Chargé de mission déchets et SIG en Normandie. Analyse de données territoriales, cartographie QGIS, tableaux de bord pour collectivités."
author: Yves Marti
keywords: "Yves Marti, SIG, QGIS, cartographie, gestion des déchets, Normandie, données territoriales, chargé de mission, collectivités, développement durable, observatoire déchets"
profession: "Chargé de mission déchets / SIG"
location: "Normandie, France"

# URL (important pour GitHub Pages)
baseurl: ""
url: "https://yvesmarti.github.io"

# Réseaux sociaux
linkedin: yvesmarti

# Configuration Jekyll
markdown: kramdown
permalink: pretty

# Plugins
plugins:
  - jekyll-sitemap

# Exclure du sitemap les pages orphelines (non liées depuis la nav / le catalogue)
defaults:
  - scope:
      path: "outils/suivi-temp.html"
    values:
      sitemap: false
  - scope:
      path: "outils/schemas_dalles_v2.html"
    values:
      sitemap: false
  - scope:
      path: "outils/optimisation_tournee.html"
    values:
      sitemap: false
  - scope:
      path: "outils/creation_retroplanning.html"
    values:
      sitemap: false
  - scope:
      path: "realisations/realisations-variant-a.html"
    values:
      sitemap: false

# Exclure certains fichiers de la compilation
exclude:
  - README.md
  - GUIDE.md
  - Gemfile
  - Gemfile.lock
